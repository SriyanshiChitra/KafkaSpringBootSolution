
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-batch-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafka-batch-service
  template:
    metadata:
      labels:
        app: kafka-batch-service
    spec:
      containers:
        - name: app
          image: kafka-batch-service:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
              value: "DEBUG"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: bootstrapServers
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: datasourceUrl
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: dbPassword
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  bootstrapServers: host.docker.internal:29094
  datasourceUrl: jdbc:postgresql://host.docker.internal:5432/messages
