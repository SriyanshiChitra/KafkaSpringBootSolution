spring.application.name=Kafka-spring-interview-solution
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messages}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:messages}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-dev-password}
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=batch-service-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topic.name=messages
app.kafka.dlq-topic.name=messages.DLQ
spring.kafka.topic.name=messages

spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=manual_immediate

spring.datasource.url=jdbc:postgresql://localhost:5432/messages
spring.datasource.username=messages
spring.datasource.password=local-dev-password
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=false