services:

  broker:

    image: apache/kafka:latest

    hostname: broker

    ports:

      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://broker:9093,CONTROLLER://broker:9094,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9093,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9094

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:

      - kafka-data:/var/lib/kafka/data

 

  postgres:

    image: postgres:16

    ports:

      - "5432:5432"

    environment:

      POSTGRES_DB: messages

      POSTGRES_USER: messages

      POSTGRES_PASSWORD: local-dev-password

    volumes:

      - pg-data:/var/lib/postgresql/data

 

volumes:

  kafka-data:

  pg-data:
